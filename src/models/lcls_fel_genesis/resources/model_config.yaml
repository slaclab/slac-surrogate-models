model_class: TorchModel
input_variables:
  alphax:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: -0.75
    value_range: [-2.5, 1.0]
  alphay:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: 1.75
    value_range: [1.0, 2.5]
  betax:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: 17.5
    value_range: [5.0, 30.0]
    unit: m
  betay:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: 17.5
    value_range: [5.0, 30.0]
    unit: m
  emitx:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: 5.5e-07
    value_range: [1.0e-07, 1.0e-06]
    unit: m
  emity:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: 5.5e-07
    value_range: [1.0e-07, 1.0e-06]
    unit: m
  chirp:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: -10.0
    value_range: [-20.0, 0.0]
    unit: MeV/m
  taper:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: 0.1
    value_range: [0.0, 0.2]
  ustart:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: 13.0
    value_range: [10.0, 16.0]
  beam_length:
    variable_class: TorchScalarVariable
    read_only: false
    default_validation_config: none
    default_value: 1.65e-05
    value_range: [1.5e-05, 1.8e-05]
    unit: m
output_variables:
  energy: {variable_class: TorchScalarVariable, read_only: false, default_validation_config: none,
    unit: uJ}
  bandwidth: {variable_class: TorchScalarVariable, read_only: false, default_validation_config: none,
    unit: eV}
  peak_intensity: {variable_class: TorchScalarVariable, read_only: false, default_validation_config: none,
    unit: au}
  peak_energy: {variable_class: TorchScalarVariable, read_only: false, default_validation_config: none,
    unit: eV}
input_validation_config: null
output_validation_config: null
model: FELmodel_model.pt
input_transformers: [FELmodel_input_transformers_0.pt]
output_transformers: [FELmodel_output_transformers_0.pt]
output_format: tensor
device: cpu
fixed_model: true
precision: double
